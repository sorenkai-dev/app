groups:
  - name: sorenkai-api.rules
    rules:
      # Error rate alerts
      - alert: APIHighErrorRate
        expr: |
          (sum(rate(http_server_requests_seconds_count{outcome="SERVER_ERROR"}[5m]))
           /
           sum(rate(http_server_requests_seconds_count[5m]))) > 0.01
        for: 5m
        labels:
          severity: warning
          service: sorenkai-api
        annotations:
          summary: "High 5xx error rate (>1% for 5m)"
          description: |
            5xx error ratio is above 1% for the last 5 minutes.
            Investigate recent deployments, dependency failures, or traffic spikes.

      - alert: APISevereErrorRate
        expr: |
          (sum(rate(http_server_requests_seconds_count{outcome="SERVER_ERROR"}[2m]))
           /
           sum(rate(http_server_requests_seconds_count[2m]))) > 0.05
        for: 2m
        labels:
          severity: critical
          service: sorenkai-api
        annotations:
          summary: "Severe 5xx error rate (>5% for 2m)"
          description: |
            5xx error ratio is above 5% for the last 2 minutes.
            Immediate attention required.

      # Latency SLO alerts using histogram quantile
      - alert: APIHighLatencyP95
        expr: |
          histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket[5m])) by (le)) > 0.5
        for: 5m
        labels:
          severity: warning
          service: sorenkai-api
        annotations:
          summary: "High p95 latency (>500ms for 5m)"
          description: |
            95th percentile latency is above 500ms for the last 5 minutes.

      - alert: APIHighLatencyP99
        expr: |
          histogram_quantile(0.99, sum(rate(http_server_requests_seconds_bucket[5m])) by (le)) > 1
        for: 5m
        labels:
          severity: critical
          service: sorenkai-api
        annotations:
          summary: "High p99 latency (>1s for 5m)"
          description: |
            99th percentile latency is above 1s for the last 5 minutes.

      # Traffic drop (warning)
      - alert: APINoTraffic
        expr: sum(rate(http_server_requests_seconds_count[10m])) < 0.01
        for: 10m
        labels:
          severity: warning
          service: sorenkai-api
        annotations:
          summary: "API receiving near-zero traffic"
          description: |
            Request rate has been near zero for 10 minutes. This may be expected in low-traffic environments.
