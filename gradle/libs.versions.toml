# gradle/libs.versions.toml
[versions]
apache_poi                  = "5.5.1"
coroutines                  = "1.10.2"
detekt                      = "2.0.0-alpha.2"
discussions                 = "0.1.0"
exposed                     = "1.2.0"
googlePubSub                = "1.150.0"
hikari                      = "7.0.2"
kotlin                      = "2.3.20"
ktlint                      = "14.0.1"
ktor                        = "3.4.2"
koin                        = "4.2.0"
kotlinx-serialization       = "1.10.0"
logback                     = "1.5.32"
logstash                    = "9.0"
mongo-bom                   = "5.7.0-beta1"
postgrejdbc                 = "42.7.10"
prometheus                  = "1.17.0-M3"

# Testing
junit                       = "6.0.1"
junit_platform              = "6.1.0-M1"
mockk                       = "1.14.9"
testcontainers              = "2.0.4"

[libraries]
# Apache
apache-poi-oomxl                = { module = "org.apache.poi:poi-ooxml", version.ref = "apache_poi" }

# Discussions DTOs
discussions-core                 = { module = "org.kindredhq.discussions:discussions-core", version.ref = "discussions" }

# Exposed
exposed-core                    = { module = "org.jetbrains.exposed:exposed-core", version.ref = "exposed" }
exposed-dao                     = { module = "org.jetbrains.exposed:exposed-dao", version.ref = "exposed" }
exposed-datetime                = { module = "org.jetbrains.exposed:exposed-kotlin-datetime", version.ref = "exposed" }
exposed-jdbc                    = { module = "org.jetbrains.exposed:exposed-jdbc", version.ref = "exposed" }
exposed-json                    = { module = "org.jetbrains.exposed:exposed-json", version.ref = "exposed" }

# Google Pub Sub
google-pubsub                   ={ module = "com.google.cloud:google-cloud-pubsub", version.ref = "googlePubSub"}

# Hikari
hikari-cp                       = { module = "com.zaxxer:HikariCP", version.ref = "hikari" }

# JWT impl used by Ktor’s JWT auth
auth0-java-jwt             = { module = "com.auth0:java-jwt", version = "4.5.0" }

# Koin
koin-ktor                      = { module = "io.insert-koin:koin-ktor", version.ref = "koin" }
koin-logger-slf4j              = { module = "io.insert-koin:koin-logger-slf4j", version.ref = "koin" }

# KotlinX
kotlinx-serialization-json     = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }

# Ktor (client)
ktor-client-core                = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-cio                 = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }

# Ktor (server) – versions are optional because io.ktor.plugin can manage them.
ktor-server-core                = { module = "io.ktor:ktor-server-core" }
ktor-server-netty               = { module = "io.ktor:ktor-server-netty" }
ktor-server-content-negotiation = { module = "io.ktor:ktor-server-content-negotiation" }
ktor-serialization-json         = { module = "io.ktor:ktor-serialization-kotlinx-json" }
ktor-server-status-pages        = { module = "io.ktor:ktor-server-status-pages" }
ktor-server-call-logging        = { module = "io.ktor:ktor-server-call-logging" }
ktor-server-default-headers     = { module = "io.ktor:ktor-server-default-headers" }
ktor-server-cors                = { module = "io.ktor:ktor-server-cors" }
ktor-server-compression         = { module = "io.ktor:ktor-server-compression" }
ktor-server-forwarded-header    = { module = "io.ktor:ktor-server-forwarded-header" }
ktor-server-request-validation  = { module = "io.ktor:ktor-server-request-validation" }
ktor-server-auth                = { module = "io.ktor:ktor-server-auth" }
ktor-server-swagger             = { module = "io.ktor:ktor-server-swagger" }
ktor-server-openapi             = { module = "io.ktor:ktor-server-openapi" }
ktor-server-test-host           = { module = "io.ktor:ktor-server-test-host" }
ktor-server-config-yaml         = { module = "io.ktor:ktor-server-config-yaml" }
ktor-server-caching-headers     = { module = "io.ktor:ktor-server-caching-headers" }
ktor-server-call-id             = { module = "io.ktor:ktor-server-call-id" }
ktor-server-auth-jwt            = { module = "io.ktor:ktor-server-auth-jwt" }

# Logging (secure)
logback-classic                = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
logstash-logback               = { module = "net.logstash.logback:logstash-logback-encoder", version.ref = "logstash" }

# Mongo (use BOM for alignment)
mongodb-bom                    = { module = "org.mongodb:mongodb-driver-bom", version.ref = "mongo-bom" }
mongodb-kotlin-coroutine       = { module = "org.mongodb:mongodb-driver-kotlin-coroutine" }
mongodb-bson-kotlinx           = { module = "org.mongodb:bson-kotlinx" }

# Observability
ktor-metrics-micrometer        = { module = "io.ktor:ktor-server-metrics-micrometer" }
micrometer-prometheus          = { module = "io.micrometer:micrometer-registry-prometheus", version.ref = "prometheus" }

# PostgreSQL
postgresql-jdbc            = { module = "org.postgresql:postgresql", version.ref = "postgrejdbc" }

# Testcontainers
testcontainers                 = { module = "org.testcontainers:testcontainers", version.ref = "testcontainers" }
testcontainers-mongodb         = { module = "org.testcontainers:testcontainers-mongodb", version.ref = "testcontainers" }

# Testing
junit-api                      = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junit" }
junit-params                   = { module = "org.junit.jupiter:junit-jupiter-params", version.ref = "junit" }
junit-engine                   = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junit" }
junit-platform-launcher        = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit_platform" }
kotlinx-coroutines-test        = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlin-test                    = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
mockk                          = { module = "io.mockk:mockk", version.ref = "mockk" }

[bundles]
ktor-base = [
  "ktor-server-core",
  "ktor-server-netty",
  "ktor-server-content-negotiation",
  "ktor-serialization-json",
  "ktor-server-status-pages",
  "ktor-server-call-logging",
  "ktor-server-default-headers",
  "ktor-server-cors",
  "ktor-server-compression",
  "ktor-server-forwarded-header",
  "ktor-server-request-validation",
  "ktor-server-auth"
]

[plugins]
detekt = { id = "dev.detekt", version.ref = "detekt" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlinx-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
ktor-plugin = { id = "io.ktor.plugin", version.ref = "ktor" }
