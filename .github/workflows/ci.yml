name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '24'
          cache: 'gradle'

      - name: Grant execute permission for Gradle Wrapper
        run: chmod +x ./gradlew

      - name: Build & Test
        run: ./gradlew --no-daemon --stacktrace build

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-reports
          path: |
            build/test-results/**/*.xml
            build/reports/tests/**/*

  smoke-test:
    name: Smoke Test (optional)
    runs-on: ubuntu-latest
    needs: build-and-test
    if: ${{ secrets.SMOKE_URL != '' }}
    environment: production
    steps:
      - name: Health check
        run: |
          set -e
          echo "Probing ${{ secrets.SMOKE_URL }}/healthz"
          curl -fsS "${{ secrets.SMOKE_URL }}/healthz" | jq -r '.' || exit 1
