name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:
    inputs:
      smoke_url:
        description: 'Base URL for deployed service (e.g., https://staging.example.com)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '24'
          cache: 'gradle'

      - name: Grant execute permission for Gradle Wrapper
        run: chmod +x ./gradlew

      - name: Build & Test
        run: ./gradlew --no-daemon --stacktrace build

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: junit-reports
          path: |
            build/test-results/**/*.xml
            build/reports/tests/**/*

  smoke-test:
    name: Smoke Test (optional)
    runs-on: ubuntu-latest
    needs: build-and-test
    if: ${{ secrets.SMOKE_URL != '' || inputs.smoke_url != '' }}
    environment: staging
    steps:
      - name: Resolve URL
        id: resolve
        shell: bash
        env:
          SMOKE_URL: ${{ secrets.SMOKE_URL }}
          INPUT_SMOKE_URL: ${{ inputs.smoke_url }}
        run: |
          set -euo pipefail
          url="$SMOKE_URL"
          if [ -z "$url" ]; then
            url="$INPUT_SMOKE_URL"
          fi
          if [ -z "$url" ]; then
            echo "No SMOKE_URL provided via secret or workflow input. Skipping." >&2
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Health check
        shell: bash
        env:
          RESOLVED_URL: ${{ steps.resolve.outputs.url }}
        run: |
          set -euo pipefail
          echo "Probing $RESOLVED_URL/serverhealth"
          curl -fsS "$RESOLVED_URL/serverhealth" -H 'Accept: application/json' | sed -e 's/.*/Response: &/'
