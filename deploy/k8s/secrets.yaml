apiVersion: v1
kind: Secret
metadata:
  name: sorenkai-api-secrets
  labels:
    app: sorenkai-api
  annotations:
    # NOTE: Replace the placeholder values below before applying to any shared environment.
    # Consider using an external secrets manager or sealed-secrets for production.
    note: "Template only. Populate via CI/CD or 'kubectl create secret' in real envs."
type: Opaque
stringData:
  # Mongo connection string
  MONGODB_URI: "mongodb://user:pass@mongo:27017/sorenkai?authSource=admin&retryWrites=false"
  # Firebase project id
  FIREBASE_PROJECT_ID: "sorenkai"
---
# Google Service Account secret for Firebase Admin SDK
# Prefer creating this dynamically to avoid committing credentials.
# Example:
#   kubectl create secret generic sorenkai-api-google-sa \
#     --from-file=firebase-service-account.json=./secrets/your-sa.json
# This manifest is a template with an empty placeholder to remind setup.
apiVersion: v1
kind: Secret
metadata:
  name: sorenkai-api-google-sa
  labels:
    app: sorenkai-api
type: Opaque
stringData:
  # The key name must match what the Deployment volume expects.
  firebase-service-account.json: |
    {
      "replace": "with-real-service-account-json",
      "type": "service_account"
    }
